name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  tag:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      created: ${{ steps.push.outputs.created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install github.com/caarlos0/svu/v3@latest
      - id: next
        run: echo "tag=$(svu next)" >> "$GITHUB_OUTPUT"
      - id: push
        env:
          NEXT: ${{ steps.next.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$NEXT" >/dev/null 2>&1; then
            echo "$NEXT already exists; skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$NEXT"
          git push origin "$NEXT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: ${{ !failure() && !cancelled() && (needs.tag.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.created == 'true' && needs.tag.outputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
