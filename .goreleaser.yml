version: 2

project_name: docstomd

builds:
  - id: docstomd
    main: ./cmd/docstomd
    binary: docstomd
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{ .Version }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^docs:"
      - Merge pull request
